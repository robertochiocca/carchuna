name: CI

on:
  push:
  pull_request:

# O workflow só lê o repositório e roda teste. Sem esta declaração vale o
# default do repositório, que pode ser de escrita — e um passo
# comprometido (dependência, action) herda o que o token permitir.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      # Sem isto, a falha do 3.10 CANCELA o 3.11 e o 3.12 e eles não
      # chegam a rodar — o vermelho aparece nos três sem ninguém saber se
      # os outros dois passariam. Numa matriz de três, ver as três custa
      # pouco e é o que diz onde o defeito começa.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          pip install ruff black pytest-cov

      - name: Auditoria de dependências (pip-audit)
        # Falha o build com CVE conhecida nas dependências instaladas.
        # É ferramenta de CI, não do projeto: o núcleo `carchuna/`
        # continua com zero dependências, e o `requirements.txt` não
        # ganhou linha nenhuma.
        #
        # O upgrade do setuptools é do RUNNER, não da Carchuna. A imagem
        # do ubuntu-latest traz setuptools 79.0.1 pré-instalado em
        # /opt/hostedtoolcache, e ele carrega a PYSEC-2026-3447 —
        # corrigida em 83.0.0. Não é dependência declarada deste projeto:
        # não está no requirements.txt nem no pyproject.toml, e mesmo
        # assim o pip-audit o vê, porque ele audita o ambiente e não o
        # arquivo.
        #
        # Só a 3.10 ficou vermelha porque desde a 3.12 o ensurepip
        # deixou de instalar setuptools, então nas outras duas ele nem
        # aparece no ambiente.
        #
        # Atualizar em vez de ignorar: existe versão corrigida, e
        # `--ignore-vuln` mandaria a auditoria calar sobre uma falha real
        # — que é o oposto do que este passo existe para fazer.
        run: |
          pip install pip-audit
          pip install --upgrade setuptools
          pip-audit --strict

      - name: Lint (ruff)
        run: ruff check .

      - name: Formatação (black)
        run: black --check .

      - name: Testes com cobertura
        # o piso é 95%: abaixo disso a cobertura deixa de ser garantia
        run: pytest -v --cov=carchuna --cov-report=term --cov-fail-under=95

      - name: Rodar o exemplo (offline, dados sintéticos)
        run: python examples/exemplo_diagnostico.py
