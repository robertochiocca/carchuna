<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 772" width="920" height="772" role="img" aria-label="Cinco conferências diferentes, em duas fileiras. As três que olham os reais: a identidade estrutural fecha por definição e não pode falhar; a reconciliação refaz a margem por um segundo caminho e pode falhar; a faixa de plausibilidade carimba o valor que não cabe em realidade contábil. As duas que olham os percentuais: o fechamento percentual exige que todo percentual publicado seja fração da mesma receita e que a soma dê 100; a aditividade em pontos de margem exige que a soma das linhas da cachoeira reproduza a manchete.">
  <defs>
    <marker id="tc-seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#87a9a8"/>
    </marker>
    <marker id="tc-seta-agua" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2ee6d6"/>
    </marker>
    <marker id="tc-seta-erro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff6b52"/>
    </marker>
  </defs>

  <rect width="920" height="772" rx="16" fill="#06272e"/>

  <text x="460" y="46" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="23" font-weight="700" fill="#ffffff">Cinco conferências, e só uma não pode falhar</text>
  <text x="460" y="72" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="13" fill="#87a9a8">a que nunca falha continua no código — com o docstring dizendo que ela não valida nada</text>

  <!-- ===================== fileira 1: os reais ===================== -->
  <line x1="34" y1="96" x2="292" y2="96" stroke="#134d57" stroke-width="1.2"/>
  <text x="460" y="101" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="11.5" font-weight="700" fill="#ead9b0" letter-spacing="1.4">OLHAM OS REAIS · receita, deduções e margem em R$</text>
  <line x1="628" y1="96" x2="886" y2="96" stroke="#134d57" stroke-width="1.2"/>

  <!-- ========== 1. identidade estrutural ========== -->
  <rect x="34" y="112" width="272" height="290" rx="12" fill="#0a3840" stroke="#134d57" stroke-width="1.5"/>
  <text x="170" y="140" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="14" font-weight="700" fill="#ead9b0">Identidade estrutural</text>

  <rect x="62" y="160" width="216" height="34" rx="7" fill="#06272e" stroke="#134d57" stroke-width="1.2"/>
  <text x="170" y="182" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="11" fill="#d8e7e5">margem := receita − Σ deduções</text>

  <line x1="170" y1="198" x2="170" y2="226" stroke="#87a9a8" stroke-width="1.6" marker-end="url(#tc-seta)"/>

  <rect x="62" y="230" width="216" height="34" rx="7" fill="#06272e" stroke="#134d57" stroke-width="1.2"/>
  <text x="170" y="252" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="11" fill="#d8e7e5">Σ deduções + margem = receita</text>

  <path d="M284,177 C308,177 308,247 284,247" fill="none" stroke="#87a9a8" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#tc-seta)"/>

  <text x="170" y="292" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="11.5" fill="#87a9a8">é a mesma frase, invertida</text>

  <rect x="62" y="310" width="216" height="30" rx="7" fill="#3a2020" stroke="#ff6b52" stroke-width="1.5"/>
  <text x="170" y="330" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="12" font-weight="700" fill="#ff6b52">não pode falhar</text>

  <text x="170" y="362" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="11" fill="#87a9a8">com comissão de 900% da receita</text>
  <text x="170" y="378" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="11" fill="#87a9a8">a margem vai a <tspan font-family="ui-monospace,Consolas,monospace" fill="#ff6b52">−1854%</tspan> e ela fecha</text>

  <!-- ========== 2. reconciliação ========== -->
  <rect x="324" y="112" width="272" height="290" rx="12" fill="#0a3840" stroke="#2ee6d6" stroke-width="1.8"/>
  <text x="460" y="140" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="14" font-weight="700" fill="#2ee6d6">Reconciliação independente</text>

  <rect x="344" y="160" width="106" height="46" rx="7" fill="#06272e" stroke="#134d57" stroke-width="1.2"/>
  <text x="397" y="180" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="11" fill="#d8e7e5">decomposição</text>
  <text x="397" y="195" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="11" fill="#87a9a8">agregada</text>

  <rect x="470" y="160" width="106" height="46" rx="7" fill="#06272e" stroke="#134d57" stroke-width="1.2"/>
  <text x="523" y="180" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="11" fill="#d8e7e5">lançamento a</text>
  <text x="523" y="195" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="11" fill="#87a9a8">lançamento</text>

  <path d="M397,210 L397,232 L460,232 L460,254" fill="none" stroke="#2ee6d6" stroke-width="1.6" marker-end="url(#tc-seta-agua)"/>
  <path d="M523,210 L523,232 L460,232" fill="none" stroke="#2ee6d6" stroke-width="1.6"/>

  <rect x="368" y="258" width="184" height="38" rx="7" fill="#0d434c" stroke="#2ee6d6" stroke-width="1.5"/>
  <text x="460" y="282" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="12.5" fill="#2ee6d6">diferença ≤ R$ 0,07</text>

  <text x="460" y="314" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="11" fill="#87a9a8">dois caminhos, duas somas</text>

  <rect x="352" y="326" width="216" height="30" rx="7" fill="#1e3a26" stroke="#8fd694" stroke-width="1.5"/>
  <text x="460" y="346" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="12" font-weight="700" fill="#8fd694">pode falhar — e falha</text>

  <text x="460" y="374" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="11" fill="#87a9a8">pega CMV cobrado em venda devolvida,</text>
  <text x="460" y="389" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="11" fill="#87a9a8">que a identidade deixa passar</text>

  <!-- ========== 3. plausibilidade ========== -->
  <rect x="614" y="112" width="272" height="290" rx="12" fill="#0a3840" stroke="#134d57" stroke-width="1.5"/>
  <text x="750" y="140" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="14" font-weight="700" fill="#ead9b0">Faixa de plausibilidade</text>

  <rect x="642" y="166" width="216" height="26" rx="6" fill="#1e3a26" stroke="#8fd694" stroke-width="1.3"/>
  <text x="750" y="184" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="11.5" fill="#8fd694">−100%  ...  +100%</text>
  <text x="750" y="208" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="10.5" fill="#87a9a8">margem que cabe em realidade contábil</text>

  <rect x="642" y="224" width="216" height="26" rx="6" fill="#3a2020" stroke="#ff6b52" stroke-width="1.3"/>
  <text x="750" y="242" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="11.5" fill="#ff6b52">dedução &gt; faturamento do mês</text>
  <text x="750" y="266" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="10.5" fill="#87a9a8">quase sempre coluna trocada, não mês ruim</text>

  <line x1="750" y1="278" x2="750" y2="304" stroke="#87a9a8" stroke-width="1.6" marker-end="url(#tc-seta)"/>

  <rect x="642" y="308" width="216" height="34" rx="7" fill="#06272e" stroke="#ead9b0" stroke-width="1.4"/>
  <text x="750" y="330" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="12" font-weight="700" fill="#ead9b0">implausível + motivo na tela</text>

  <text x="750" y="362" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="11" fill="#87a9a8">o valor não é limitado nem escondido:</text>
  <text x="750" y="378" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="11" fill="#87a9a8">absurdo com teto vira absurdo invisível</text>

  <!-- ===================== fileira 2: os percentuais ===================== -->
  <line x1="34" y1="436" x2="196" y2="436" stroke="#134d57" stroke-width="1.2"/>
  <text x="460" y="441" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="11.5" font-weight="700" fill="#2ee6d6" letter-spacing="1.4">OLHAM OS PERCENTUAIS · o que a cachoeira publica · as duas podem falhar</text>
  <line x1="724" y1="436" x2="886" y2="436" stroke="#134d57" stroke-width="1.2"/>

  <!-- ========== 4. fechamento percentual ========== -->
  <rect x="34" y="452" width="418" height="252" rx="12" fill="#0a3840" stroke="#134d57" stroke-width="1.5"/>
  <text x="243" y="480" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="14" font-weight="700" fill="#ead9b0">Fechamento percentual</text>

  <rect x="58" y="496" width="370" height="30" rx="7" fill="#06272e" stroke="#8fd694" stroke-width="1.3"/>
  <text x="243" y="516" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="11.5" fill="#8fd694">pct := valor ÷ receita bruta</text>
  <text x="243" y="540" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="10.5" fill="#87a9a8">todo percentual publicado, fração da MESMA receita</text>

  <rect x="58" y="550" width="370" height="30" rx="7" fill="#3a2020" stroke="#ff6b52" stroke-width="1.3"/>
  <text x="243" y="570" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="11.5" fill="#ff6b52">pct := valor ÷ (receita − devoluções)</text>
  <text x="243" y="594" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="10.5" fill="#87a9a8">a base legal do art. 3º, § 1º — uma "correção" plausível</text>

  <line x1="243" y1="604" x2="243" y2="626" stroke="#ff6b52" stroke-width="1.6" marker-end="url(#tc-seta-erro)"/>

  <rect x="90" y="630" width="306" height="30" rx="7" fill="#06272e" stroke="#ff6b52" stroke-width="1.5"/>
  <text x="243" y="650" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="12" font-weight="700" fill="#ff6b52">a tela publica percentuais que somam 101,41%</text>

  <text x="243" y="676" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="11" fill="#87a9a8">e os valores em reais continuam certos, a reconciliação</text>
  <text x="243" y="691" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="11" fill="#87a9a8">diz ok e a identidade fecha — nenhuma das três vê</text>

  <!-- ========== 5. aditividade em p.p. ========== -->
  <rect x="468" y="452" width="418" height="252" rx="12" fill="#0a3840" stroke="#2ee6d6" stroke-width="1.8"/>
  <text x="677" y="480" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="14" font-weight="700" fill="#2ee6d6">Aditividade em pontos de margem</text>

  <rect x="492" y="496" width="176" height="42" rx="7" fill="#06272e" stroke="#134d57" stroke-width="1.2"/>
  <text x="580" y="514" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="10.5" fill="#87a9a8">manchete</text>
  <text x="580" y="530" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="12" fill="#d8e7e5">−13,14 p.p.</text>

  <rect x="686" y="496" width="176" height="42" rx="7" fill="#06272e" stroke="#134d57" stroke-width="1.2"/>
  <text x="774" y="514" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="10.5" fill="#87a9a8">Σ das linhas da cachoeira</text>
  <text x="774" y="530" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="12" fill="#d8e7e5">−13,14 p.p.</text>

  <path d="M580,542 L580,556 L677,556 L677,570" fill="none" stroke="#2ee6d6" stroke-width="1.6" marker-end="url(#tc-seta-agua)"/>
  <path d="M774,542 L774,556 L677,556" fill="none" stroke="#2ee6d6" stroke-width="1.6"/>

  <rect x="524" y="574" width="306" height="30" rx="7" fill="#0d434c" stroke="#2ee6d6" stroke-width="1.5"/>
  <text x="677" y="594" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="12" font-weight="700" fill="#2ee6d6">iguais na unha, e não "dentro da tolerância"</text>

  <text x="677" y="620" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="10.5" fill="#87a9a8">o resíduo de arredondamento vai por maior-resto — mas só</text>
  <text x="677" y="635" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="10.5" fill="#87a9a8">até um centésimo por linha. Acima disso não é arredondamento:</text>
  <text x="677" y="650" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="10.5" fill="#87a9a8">é driver faltando, e a divergência sai carimbada</text>

  <rect x="524" y="662" width="306" height="28" rx="7" fill="#06272e" stroke="#134d57" stroke-width="1.3"/>
  <text x="677" y="681" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="11" fill="#d8e7e5">limiar = min(1,0 p.p.; 10% da margem base)</text>

  <!-- ===================== rodapé ===================== -->
  <line x1="34" y1="726" x2="886" y2="726" stroke="#134d57" stroke-width="1.2"/>
  <text x="460" y="750" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="12.5" fill="#d8e7e5">Uma asserção que nunca falha não é validação — é regressão contra erro de digitação no código</text>
  <text x="460" y="766" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="11" fill="#87a9a8">os limiares e as tolerâncias moram todos em carchuna/validade.py, com o porquê de cada um ao lado</text>
</svg>
