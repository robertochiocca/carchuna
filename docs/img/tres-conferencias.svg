<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="920" height="470" role="img" aria-label="Três conferências diferentes: a identidade estrutural fecha por definição e não pode falhar; a reconciliação refaz a margem por um segundo caminho e pode falhar; a faixa de plausibilidade carimba o valor que não cabe em realidade contábil.">
  <defs>
    <marker id="tc-seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#87a9a8"/>
    </marker>
    <marker id="tc-seta-agua" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2ee6d6"/>
    </marker>
  </defs>

  <rect width="920" height="470" rx="16" fill="#06272e"/>

  <text x="460" y="46" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="23" font-weight="700" fill="#ffffff">Três conferências, e só duas podem falhar</text>
  <text x="460" y="72" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="13" fill="#87a9a8">a que nunca falha continua no código — com o docstring dizendo que ela não valida nada</text>

  <!-- ================= 1. identidade estrutural ================= -->
  <rect x="34" y="98" width="272" height="290" rx="12" fill="#0a3840" stroke="#134d57" stroke-width="1.5"/>
  <text x="170" y="126" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="14" font-weight="700" fill="#ead9b0">Identidade estrutural</text>

  <rect x="62" y="146" width="216" height="34" rx="7" fill="#06272e" stroke="#134d57" stroke-width="1.2"/>
  <text x="170" y="168" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="11" fill="#d8e7e5">margem := receita − Σ deduções</text>

  <line x1="170" y1="184" x2="170" y2="212" stroke="#87a9a8" stroke-width="1.6" marker-end="url(#tc-seta)"/>

  <rect x="62" y="216" width="216" height="34" rx="7" fill="#06272e" stroke="#134d57" stroke-width="1.2"/>
  <text x="170" y="238" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="11" fill="#d8e7e5">Σ deduções + margem = receita</text>

  <path d="M284,163 C308,163 308,233 284,233" fill="none" stroke="#87a9a8" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#tc-seta)"/>

  <text x="170" y="278" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="11.5" fill="#87a9a8">é a mesma frase, invertida</text>

  <rect x="62" y="296" width="216" height="30" rx="7" fill="#3a2020" stroke="#ff6b52" stroke-width="1.5"/>
  <text x="170" y="316" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="12" font-weight="700" fill="#ff6b52">não pode falhar</text>

  <text x="170" y="348" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="11" fill="#87a9a8">com comissão de 900% da receita</text>
  <text x="170" y="364" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="11" fill="#87a9a8">a margem vai a <tspan font-family="ui-monospace,Consolas,monospace" fill="#ff6b52">−1854%</tspan> e ela fecha</text>

  <!-- ================= 2. reconciliação ================= -->
  <rect x="324" y="98" width="272" height="290" rx="12" fill="#0a3840" stroke="#2ee6d6" stroke-width="1.8"/>
  <text x="460" y="126" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="14" font-weight="700" fill="#2ee6d6">Reconciliação independente</text>

  <rect x="344" y="146" width="106" height="46" rx="7" fill="#06272e" stroke="#134d57" stroke-width="1.2"/>
  <text x="397" y="166" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="11" fill="#d8e7e5">decomposição</text>
  <text x="397" y="181" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="11" fill="#87a9a8">agregada</text>

  <rect x="470" y="146" width="106" height="46" rx="7" fill="#06272e" stroke="#134d57" stroke-width="1.2"/>
  <text x="523" y="166" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="11" fill="#d8e7e5">lançamento a</text>
  <text x="523" y="181" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="11" fill="#87a9a8">lançamento</text>

  <path d="M397,196 L397,218 L460,218 L460,240" fill="none" stroke="#2ee6d6" stroke-width="1.6" marker-end="url(#tc-seta-agua)"/>
  <path d="M523,196 L523,218 L460,218" fill="none" stroke="#2ee6d6" stroke-width="1.6"/>

  <rect x="368" y="244" width="184" height="38" rx="7" fill="#0d434c" stroke="#2ee6d6" stroke-width="1.5"/>
  <text x="460" y="268" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="12.5" fill="#2ee6d6">diferença ≤ R$ 0,07</text>

  <text x="460" y="300" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="11" fill="#87a9a8">dois caminhos, duas somas</text>

  <rect x="352" y="312" width="216" height="30" rx="7" fill="#1e3a26" stroke="#8fd694" stroke-width="1.5"/>
  <text x="460" y="332" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="12" font-weight="700" fill="#8fd694">pode falhar — e falha</text>

  <text x="460" y="360" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="11" fill="#87a9a8">pega CMV cobrado em venda devolvida,</text>
  <text x="460" y="375" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="11" fill="#87a9a8">que a identidade deixa passar</text>

  <!-- ================= 3. plausibilidade ================= -->
  <rect x="614" y="98" width="272" height="290" rx="12" fill="#0a3840" stroke="#134d57" stroke-width="1.5"/>
  <text x="750" y="126" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="14" font-weight="700" fill="#ead9b0">Faixa de plausibilidade</text>

  <rect x="642" y="152" width="216" height="26" rx="6" fill="#1e3a26" stroke="#8fd694" stroke-width="1.3"/>
  <text x="750" y="170" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="11.5" fill="#8fd694">−100%  ...  +100%</text>
  <text x="750" y="194" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="10.5" fill="#87a9a8">margem que cabe em realidade contábil</text>

  <rect x="642" y="210" width="216" height="26" rx="6" fill="#3a2020" stroke="#ff6b52" stroke-width="1.3"/>
  <text x="750" y="228" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="11.5" fill="#ff6b52">dedução &gt; faturamento do mês</text>
  <text x="750" y="252" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="10.5" fill="#87a9a8">quase sempre coluna trocada, não mês ruim</text>

  <line x1="750" y1="264" x2="750" y2="290" stroke="#87a9a8" stroke-width="1.6" marker-end="url(#tc-seta)"/>

  <rect x="642" y="294" width="216" height="34" rx="7" fill="#06272e" stroke="#ead9b0" stroke-width="1.4"/>
  <text x="750" y="316" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="12" font-weight="700" fill="#ead9b0">implausível + motivo na tela</text>

  <text x="750" y="348" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="11" fill="#87a9a8">o valor não é limitado nem escondido:</text>
  <text x="750" y="364" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="11" fill="#87a9a8">absurdo com teto vira absurdo invisível</text>

  <!-- rodapé -->
  <line x1="34" y1="410" x2="886" y2="410" stroke="#134d57" stroke-width="1.2"/>
  <text x="460" y="436" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="12.5" fill="#d8e7e5">Uma asserção que nunca falha não é validação — é regressão contra erro de digitação no código</text>
  <text x="460" y="456" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="11" fill="#87a9a8">os limiares e as tolerâncias moram todos em carchuna/validade.py, com o porquê de cada um ao lado</text>
</svg>
