[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carchuna"
version = "1.0.0"
description = "Raio-X verificável da margem para PMEs brasileiras: decompõe onde o lucro morre (impostos, marketplaces, adquirência) e aponta remédios com base legal citada."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Roberto Chiocca" }]
keywords = [
    "fintech",
    "legaltech",
    "simples-nacional",
    "e-commerce",
    "margem",
    "pme",
    "rag",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Portuguese (Brazilian)",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Accounting",
]
# O núcleo (margem, métricas, cenários, diagnóstico, RAG) é Python puro:
# roda em qualquer lugar, sem nenhuma dependência — degradação graciosa.
dependencies = []

[project.optional-dependencies]
viz = ["matplotlib>=3.7"]
app = [
    "streamlit>=1.37",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
llm = ["anthropic>=0.40"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "black>=24.0",
    "ruff>=0.4",
    "openpyxl>=3.1",
    "fastapi>=0.110",
    "httpx>=0.27",
    "pdfplumber>=0.11",
    # o teste de UI do dashboard roda o app.py de verdade (AppTest)
    "streamlit>=1.37",
    "pandas>=2.0",
]

[project.urls]
Repository = "https://github.com/robertochiocca/carchuna"

[tool.setuptools]
packages = ["carchuna", "carchuna.rag", "carchuna.api", "carchuna.conectores"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle (erros)
    "W",   # pycodestyle (avisos)
    "F",   # pyflakes
    "I",   # isort (ordem dos imports)
    "UP",  # pyupgrade (sintaxe moderna)
    "B",   # flake8-bugbear (bugs prováveis)
    "SIM", # flake8-simplify
]

[tool.ruff.lint.per-file-ignores]
# exemplos e testes ajustam sys.path antes dos imports (rodam sem install)
"examples/*" = ["E402"]
"tests/*" = ["E402"]

[tool.coverage.run]
source = ["carchuna"]

[tool.mypy]
# Entrou por um defeito concreto: `_conferir_sublimite_icms_iss` foi
# anotada `-> tuple[str, ...]` e devolvia uma string entre parênteses,
# sem a vírgula. Uma string é iterável, então a tela publicaria a
# mensagem letra a letra sem nada reclamar. Foi pego por teste, mas
# depender de eu ter escrito o teste certo é frágil: a anotação já
# dizia a verdade, e conferi-la é estático e de graça.
python_version = "3.10"
files = ["carchuna"]
# Os extras de `[project.optional-dependencies]` não são instalados para
# esta checagem: o núcleo roda sem eles, e exigir os stubs faria a
# conferência de tipos depender de dependência que o projeto não tem.
ignore_missing_imports = true

# ==========================================================================
# DÍVIDA, não isenção permanente.
#
# Estes cinco códigos estão desligados porque hoje o núcleo tem 21
# ocorrências deles, e TODAS são a mesma lacuna: `ConfigTributaria` traz
# `anexo_simples: str | None` e `das_mei_mensal: Decimal | None`, e o que
# garante que não são None é o `__post_init__` — invariante de runtime que
# o mypy não enxerga. Nenhuma é bug vivo; conferido caso a caso.
#
# Ligar os cinco hoje exigiria `assert` espalhado pelos pontos de chamada
# ou partir `ConfigTributaria` em um tipo por regime. A segunda é a
# correção de verdade e é refatoração do `margem.py` — decisão à parte,
# não carona nesta.
#
# O que fica ligado pega o defeito que motivou tudo isto: `return-value`.
# ==========================================================================
disable_error_code = ["arg-type", "operator", "assignment", "union-attr", "index"]
